<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>현장 관리 & 공사일보 | INDECOMPANY</title>

  <!-- Google Fonts & Icons -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@300;400;500;700;800;900&family=Outfit:wght@400;600;700&display=swap" rel="stylesheet">
  
  <style>
    :root {
      --primary-color: #dd5828;
      --primary-dark: #b84318;
      --primary-light: #fdf0eb;
      --accent-color: #e07a5f;
      --bg-color: #f8f7f4;
      --card-bg: #ffffff;
      --text-main: #2b2d42;
      --text-muted: #6c757d;
      --border-color: #eee8e4;
      --radius-lg: 20px;
      --radius-md: 14px;
      --radius-sm: 8px;
      --shadow-sm: 0 4px 12px rgba(0, 0, 0, 0.04);
      --shadow-md: 0 8px 24px rgba(0, 0, 0, 0.08);
      --font-kr: 'Noto Sans KR', sans-serif;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: var(--font-kr);
      -webkit-tap-highlight-color: transparent;
    }

    body {
      background-color: var(--bg-color);
      color: var(--text-main);
      min-height: 100vh;
      padding-bottom: 60px;
    }

    /* Container & Layout */
    .app-wrapper {
      max-width: 1200px;
      margin: 0 auto;
      padding: 16px;
    }

    /* Header Bar (Sleek Mobile & PC Layout) */
    .app-header {
      display: flex;
      flex-direction: column;
      gap: 12px;
      padding: 8px 4px 18px;
    }

    .header-main-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      width: 100%;
    }

    .header-sub-row {
      display: flex;
      align-items: center;
      width: 100%;
    }

    @media (min-width: 768px) {
      .app-header {
        flex-direction: row;
        align-items: center;
        justify-content: space-between;
        gap: 16px;
      }
      .header-main-row {
        width: auto;
        gap: 16px;
      }
      .header-sub-row {
        width: auto;
      }
    }

    .brand-logo {
      display: flex;
      align-items: center;
      gap: 8px;
      text-decoration: none;
    }

    .brand-badge {
      background: var(--primary-color);
      color: #fff;
      font-size: 0.75rem;
      font-weight: 900;
      padding: 4px 10px;
      border-radius: 8px;
      letter-spacing: 0.04em;
    }

    .brand-name {
      font-size: 1.15rem;
      font-weight: 900;
      color: var(--text-main);
      letter-spacing: -0.01em;
    }

    /* Site Selector Dropdown */
    .site-selector-container {
      position: relative;
      width: 100%;
    }

    @media (min-width: 768px) {
      .site-selector-container {
        width: auto;
      }
    }

    .site-selector-btn {
      background: #ffffff;
      border: 1px solid var(--border-color);
      padding: 7px 14px;
      border-radius: 20px;
      font-size: 0.82rem;
      font-weight: 700;
      color: var(--text-main);
      display: flex;
      align-items: center;
      gap: 6px;
      cursor: pointer;
      box-shadow: var(--shadow-sm);
      transition: all 0.2s ease;
      width: 100%;
    }

    @media (min-width: 768px) {
      .site-selector-btn {
        width: auto;
      }
    }

    .site-selector-btn:hover {
      border-color: var(--primary-color);
      background: #fafbf9;
    }

    .site-name-txt {
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      max-width: 220px;
    }

    .site-selector-dropdown {
      position: absolute;
      top: 100%;
      left: 0;
      margin-top: 8px;
      width: 280px;
      background: #ffffff;
      border: 1px solid var(--border-color);
      border-radius: var(--radius-md);
      box-shadow: var(--shadow-md);
      z-index: 999;
      display: none;
      flex-direction: column;
      overflow: hidden;
    }

    .site-selector-dropdown.active {
      display: flex;
    }

    .site-dropdown-header {
      padding: 10px 14px;
      font-size: 0.78rem;
      font-weight: 800;
      color: var(--text-muted);
      background: #f8fafc;
      border-bottom: 1px solid #e2e8f0;
    }

    .site-dropdown-list {
      max-height: 260px;
      overflow-y: auto;
    }

    .site-dropdown-item {
      padding: 8px 12px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      border-bottom: 1px dashed #f0f0f0;
      transition: background 0.15s ease;
    }

    .site-dropdown-item:hover, .site-dropdown-item.active {
      background: var(--primary-light);
    }

    .site-dropdown-code {
      font-size: 0.7rem;
      background: rgba(0,0,0,0.06);
      padding: 2px 5px;
      border-radius: 4px;
      font-family: monospace;
    }

    .site-dropdown-footer {
      padding: 8px;
      background: #f8fafc;
      border-top: 1px solid #e2e8f0;
    }

    .btn-create-site {
      width: 100%;
      background: var(--primary-color);
      color: #fff;
      border: none;
      padding: 8px 0;
      border-radius: 8px;
      font-size: 0.8rem;
      font-weight: 700;
      cursor: pointer;
    }

    .btn-create-site:hover {
      background: var(--primary-dark);
    }

    .admin-toggle-btn {
      background: #ffffff;
      border: 1px solid var(--primary-color);
      color: var(--primary-color);
      padding: 7px 14px;
      border-radius: 30px;
      font-size: 0.82rem;
      font-weight: 700;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 6px;
      box-shadow: var(--shadow-sm);
      transition: all 0.2s ease;
    }

    .admin-toggle-btn.active {
      background: var(--primary-color);
      color: #fff;
    }

    /* PC Dashboard Grid vs Mobile Stack Layout */
    .dashboard-grid {
      display: grid;
      grid-template-columns: 1fr;
      gap: 18px;
    }

    @media (min-width: 900px) {
      .dashboard-grid {
        grid-template-columns: 380px 1fr;
        align-items: start;
      }
      .grid-col-left {
        display: flex;
        flex-direction: column;
        gap: 18px;
      }
      .grid-col-right {
        display: flex;
        flex-direction: column;
        gap: 18px;
      }
    }

    @media (max-width: 899px) {
      .app-wrapper {
        padding: 6px;
      }
      .card {
        padding: 12px 6px;
      }
      .dashboard-grid {
        display: flex;
        flex-direction: column;
        gap: 16px;
      }
      .calendar-grid {
        grid-template-columns: repeat(7, minmax(0, 1fr)) !important;
        width: 100% !important;
      }
      .cal-day-header {
        padding: 6px 1px;
        font-size: 0.72rem;
      }
      .cal-cell {
        min-height: 58px;
        padding: 2px 0px 4px 0px;
        min-width: 0 !important;
      }
      .cal-date-num {
        font-size: 0.68rem;
        padding: 0 2px;
        margin-bottom: 2px;
      }
      .gantt-bar-container {
        gap: 2px;
      }
      .gantt-item-placeholder {
        height: 14px;
      }
      .gantt-item {
        font-size: 0.55rem;
        height: 15px;
        line-height: 15px;
        padding: 0 1px;
      }
      .gantt-item.is-start {
        padding-left: 2px;
      }
      .gantt-item.is-end {
        padding-right: 2px;
      }
    }

    /* Card Box */
    .card {
      background: var(--card-bg);
      border-radius: var(--radius-lg);
      padding: 20px;
      box-shadow: var(--shadow-sm);
      border: 1px solid var(--border-color);
      position: relative;
    }

    .card-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 16px;
    }

    .card-title {
      font-size: 1.1rem;
      font-weight: 800;
      color: var(--text-main);
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .btn-edit-section {
      font-size: 0.78rem;
      font-weight: 700;
      color: var(--primary-color);
      background: var(--primary-light);
      border: none;
      padding: 4px 10px;
      border-radius: 6px;
      cursor: pointer;
    }

    /* 1. Hero Project Card */
    .hero-card {
      background: linear-gradient(135deg, #e06637 0%, #b84318 100%);
      color: #ffffff;
      border: none;
    }

    .hero-subtitle {
      font-size: 0.88rem;
      opacity: 0.88;
      font-weight: 500;
      margin-bottom: 4px;
    }

    .hero-title {
      font-size: 1.5rem;
      font-weight: 800;
      letter-spacing: -0.02em;
      margin-bottom: 8px;
    }

    .hero-meta {
      font-size: 0.84rem;
      opacity: 0.9;
      margin-bottom: 18px;
    }

    .progress-bar-wrap {
      background: rgba(255, 255, 255, 0.28);
      border-radius: 10px;
      height: 10px;
      overflow: hidden;
      margin-bottom: 8px;
    }

    .progress-bar-fill {
      height: 100%;
      background: #ffffff;
      border-radius: 10px;
      width: 0%;
      transition: width 0.6s cubic-bezier(0.4, 0, 0.2, 1);
    }

    .progress-labels {
      display: flex;
      justify-content: space-between;
      font-size: 0.82rem;
      font-weight: 700;
    }

    /* 2. Managers List */
    .manager-list {
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .manager-item {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 8px 0;
      border-bottom: 1px dashed #f0f0f0;
    }

    .manager-item:last-child {
      border-bottom: none;
    }

    .manager-info {
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 0.92rem;
    }

    .manager-role {
      color: var(--text-muted);
      font-weight: 500;
    }

    .manager-name {
      font-weight: 700;
      color: var(--text-main);
    }

    .btn-call {
      background: #1e2432;
      color: #ffffff;
      text-decoration: none;
      font-size: 0.82rem;
      font-weight: 700;
      padding: 8px 18px;
      border-radius: 30px;
      display: flex;
      align-items: center;
      gap: 6px;
      transition: transform 0.15s ease;
    }

    .btn-call:active {
      transform: scale(0.96);
    }

    /* 3. Calendar & Schedule UI (Naver Calendar Continuous Gantt Style) */
    .calendar-nav {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 12px;
    }

    .calendar-month-btn {
      background: none;
      border: none;
      font-size: 0.85rem;
      font-weight: 700;
      color: var(--text-muted);
      cursor: pointer;
      padding: 4px 8px;
    }

    .calendar-current-month {
      font-size: 1.05rem;
      font-weight: 800;
    }

    .calendar-grid {
      display: grid;
      grid-template-columns: repeat(7, minmax(0, 1fr));
      gap: 1px;
      background: #e2e6df;
      border-radius: var(--radius-md);
      overflow: hidden;
      border: 1px solid #e2e6df;
      width: 100%;
    }

    .cal-day-header {
      background: #fafbf9;
      text-align: center;
      padding: 8px 2px;
      font-size: 0.78rem;
      font-weight: 800;
      color: #4a5568;
    }

    .cal-day-header.sun { color: #e53e3e; }
    .cal-day-header.sat { color: #3182ce; }

    .cal-cell {
      background: #ffffff;
      min-height: 82px;
      padding: 4px 0px 6px 0px;
      display: flex;
      flex-direction: column;
      position: relative;
      cursor: pointer;
      overflow: visible;
      min-width: 0;
    }

    .cal-cell.other-month {
      background: #fcfdfc;
      opacity: 0.4;
    }

    .cal-cell.today {
      background: #fdf5f2;
    }

    .cal-date-num {
      padding: 0 5px;
      font-size: 0.78rem;
      font-weight: 700;
      margin-bottom: 4px;
      color: var(--text-main);
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .cal-cell.sun .cal-date-num { color: #e53e3e; }
    .cal-cell.sat .cal-date-num { color: #3182ce; }
    .cal-cell.red-day .cal-date-num { color: #e53e3e; font-weight: 800; }

    .gantt-bar-container {
      display: flex;
      flex-direction: column;
      gap: 3px;
      width: 100%;
    }

    .gantt-item-placeholder {
      height: 19px;
      visibility: hidden;
    }

    .gantt-item {
      font-size: 0.68rem;
      font-weight: 700;
      color: #ffffff;
      height: 19px;
      line-height: 19px;
      padding: 0 4px;
      border-radius: 0;
      margin-left: -1px;
      margin-right: -1px;
      white-space: nowrap;
      position: relative;
      z-index: 1;
      box-shadow: inset 0 -1px 0 rgba(0,0,0,0.08);
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .gantt-item.is-start {
      border-top-left-radius: 6px;
      border-bottom-left-radius: 6px;
      margin-left: 2px;
      padding-left: 5px;
      z-index: 3;
    }

    .gantt-item.is-start > .bar-txt-label {
      position: absolute;
      left: 5px;
      top: 0;
      height: 100%;
      display: flex;
      align-items: center;
      white-space: nowrap;
      z-index: 5;
      pointer-events: none;
    }

    .gantt-item.is-end {
      border-top-right-radius: 6px;
      border-bottom-right-radius: 6px;
      margin-right: 2px;
      padding-right: 5px;
      z-index: 2;
    }

    /* 4. Daily Construction Journal (공사일보) */
    .journal-date-badge {
      font-size: 0.85rem;
      font-weight: 700;
      color: var(--text-muted);
      margin-bottom: 8px;
    }

    .tag-cloud {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
      margin-bottom: 12px;
    }

    .tag-item {
      background: #fdf0eb;
      color: var(--primary-dark);
      font-size: 0.75rem;
      font-weight: 700;
      padding: 3px 10px;
      border-radius: 12px;
    }

    .journal-desc {
      font-size: 0.9rem;
      line-height: 1.6;
      color: #333d47;
      margin-bottom: 16px;
      white-space: pre-line;
      background: #fbfbf9;
      padding: 12px 14px;
      border-radius: var(--radius-sm);
      border-left: 3px solid var(--primary-color);
    }

    .photo-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 8px;
      margin-bottom: 16px;
    }

    .photo-thumb {
      aspect-ratio: 1 / 1;
      border-radius: var(--radius-md);
      overflow: hidden;
      position: relative;
      background: #eaede8;
      cursor: pointer;
    }

    .photo-thumb img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      transition: transform 0.3s ease;
    }

    .photo-thumb:hover img {
      transform: scale(1.05);
    }

    .photo-delete-btn {
      position: absolute;
      top: 4px;
      right: 4px;
      background: rgba(0, 0, 0, 0.65);
      color: #fff;
      border: none;
      width: 22px;
      height: 22px;
      border-radius: 50%;
      font-size: 12px;
      cursor: pointer;
      display: none;
      align-items: center;
      justify-content: center;
    }

    .admin-mode .photo-delete-btn {
      display: flex;
    }

    .btn-journal-history {
      color: #2b6cb0;
      font-size: 0.85rem;
      font-weight: 700;
      text-decoration: none;
      display: inline-flex;
      align-items: center;
      gap: 4px;
      padding-top: 10px;
      border-top: 1px solid var(--border-color);
      width: 100%;
      cursor: pointer;
      background: none;
      border-left: none;
      border-right: none;
      border-bottom: none;
    }

    /* 5. Documents & Drawings Section */
    .docs-section-title {
      font-size: 0.88rem;
      font-weight: 700;
      color: var(--text-muted);
      margin: 14px 0 8px;
    }

    .docs-file-list {
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .file-item {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 10px 14px;
      background: #ffffff;
      border: 1px solid #e2e8f0;
      border-radius: var(--radius-md);
      font-size: 0.85rem;
      text-decoration: none;
      color: var(--text-main);
      transition: background 0.15s ease;
    }

    .file-item:hover {
      background: #f8fafc;
    }

    .file-info {
      display: flex;
      align-items: center;
      gap: 10px;
      overflow: hidden;
    }

    .file-icon {
      font-size: 1.1rem;
    }

    .file-name {
      font-weight: 600;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .btn-remove-file {
      background: none;
      border: none;
      color: #e53e3e;
      font-size: 0.9rem;
      cursor: pointer;
      display: none;
    }

    .admin-mode .btn-remove-file {
      display: block;
    }

    .file-upload-box {
      border: 2px dashed #cbd5e0;
      border-radius: var(--radius-md);
      padding: 16px;
      text-align: center;
      background: #f8fafc;
      cursor: pointer;
      transition: border-color 0.2s ease;
    }

    .file-upload-box:hover {
      border-color: var(--primary-color);
      background: #f1f5f9;
    }

    .file-upload-icon {
      font-size: 1.5rem;
      margin-bottom: 6px;
    }

    .file-upload-txt {
      font-size: 0.84rem;
      font-weight: 700;
      color: #4a5568;
    }

    .btn-primary {
      background: var(--primary-color);
      color: #fff;
      border: none;
      padding: 10px 18px;
      border-radius: 10px;
      font-size: 0.88rem;
      font-weight: 700;
      cursor: pointer;
      transition: background 0.2s ease;
    }

    .btn-primary:hover {
      background: var(--primary-dark);
    }

    .btn-secondary {
      background: #e2e8f0;
      color: #4a5568;
      border: none;
      padding: 10px 18px;
      border-radius: 10px;
      font-size: 0.88rem;
      font-weight: 700;
      cursor: pointer;
    }

    /* Lightbox Modal */
    .lightbox-modal {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      background: rgba(0, 0, 0, 0.9);
      z-index: 9999;
      display: none;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }

    .lightbox-modal.active {
      display: flex;
    }

    .lightbox-img {
      max-width: 95%;
      max-height: 80vh;
      object-fit: contain;
      border-radius: 8px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.5);
    }

    .lightbox-caption {
      color: #ffffff;
      font-size: 0.95rem;
      margin-top: 14px;
      font-weight: 600;
      text-align: center;
    }

    .lightbox-close-btn {
      position: absolute;
      top: 20px;
      right: 20px;
      background: rgba(255, 255, 255, 0.2);
      color: #fff;
      border: none;
      width: 40px;
      height: 40px;
      border-radius: 50%;
      font-size: 24px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    /* General Edit Modal */
    .modal-overlay {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      background: rgba(0, 0, 0, 0.5);
      z-index: 999;
      display: none;
      align-items: center;
      justify-content: center;
      padding: 16px;
    }

    .modal-overlay.active {
      display: flex;
    }

    .modal-box {
      background: #ffffff;
      border-radius: var(--radius-lg);
      width: 100%;
      max-width: 520px;
      padding: 24px;
      box-shadow: var(--shadow-md);
      max-height: 90vh;
      overflow-y: auto;
    }

    .modal-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 18px;
    }

    .modal-title {
      font-size: 1.15rem;
      font-weight: 800;
    }

    .form-group {
      margin-bottom: 14px;
    }

    .form-label {
      display: block;
      font-size: 0.82rem;
      font-weight: 700;
      margin-bottom: 6px;
      color: #4a5568;
    }

    .form-input, .form-textarea, .form-select {
      width: 100%;
      padding: 10px 12px;
      border: 1px solid #cbd5e0;
      border-radius: 8px;
      font-size: 0.9rem;
      outline: none;
    }

    .form-input:focus, .form-textarea:focus {
      border-color: var(--primary-color);
    }
  </style>
</head>
<body>

  <div class="app-wrapper">
    <!-- Header Bar (Responsive Mobile & PC) -->
    <header class="app-header">
      <div class="header-main-row">
        <a href="https://INDE.CO.KR" target="_blank" class="brand-logo">
          <span class="brand-badge">INDE</span>
          <span class="brand-name">INDECOMPANY</span>
        </a>

        <button class="admin-toggle-btn" id="adminToggleBtn">
          <span class="icon">✏️</span>
          <span id="adminToggleTxt">수정모드</span>
        </button>
      </div>

      <div class="header-sub-row">
        <!-- Collapsible Multi-Site Selector Dropdown -->
        <div class="site-selector-container">
          <button class="site-selector-btn" id="siteSelectorBtn">

    // --- Multi-Site & Cloud Database Sync Engine ---
    function getCurrentSiteCode() {
      const path = location.pathname.toLowerCase();
      const match = path.match(/\/g-(\d+)/);
      if (match && match[1]) {
        return `g-${match[1]}`;
      }
      const urlParams = new URLSearchParams(location.search);
      const siteParam = urlParams.get('site');
      if (siteParam) {
        return `g-${siteParam}`;
      }
      return "g-1";
    }

    const CURRENT_SITE_CODE = getCurrentSiteCode();

    function getMasterSitesList() {
      let masterList = [];
      const saved = localStorage.getItem("edam_master_sites_list");
      if (saved) {
        try {
          masterList = JSON.parse(saved);
        } catch (e) {
          masterList = [];
        }
      }

      if (!Array.isArray(masterList)) masterList = [];

      if (!masterList.some(s => s.code === "g-1")) {
        masterList.unshift({ id: 1, code: "g-1", title: "회사 별장공사 3억평", subtitle: "테스트 고객님의 공사", url: "/g-1" });
      }

      try {
        for (let i = 0; i < localStorage.length; i++) {
          const key = localStorage.key(i);
          if (key && key.startsWith("edam_site_data_g-")) {
            const code = key.replace("edam_site_data_", "");
            const idNum = parseInt(code.replace("g-", ""), 10);
            
            let siteItem = masterList.find(s => s.code === code);
            const dataStr = localStorage.getItem(key);
            let siteTitle = `현장 ${idNum}`;
            let siteSubtitle = "공사 진행 중";

            if (dataStr) {
              try {
                const p = JSON.parse(dataStr);
                if (p.project && p.project.title) siteTitle = p.project.title;
                if (p.project && p.project.subtitle) siteSubtitle = p.project.subtitle;
              } catch (e) {}
            }

            if (!siteItem) {
              masterList.push({
                id: idNum || Date.now(),
                code,
                title: siteTitle,
                subtitle: siteSubtitle,
                url: `/${code}`
              });
            } else {
              siteItem.title = siteTitle;
              siteItem.subtitle = siteSubtitle;
            }
          }
        }
      } catch (e) {}

      masterList.sort((a, b) => {
        const numA = parseInt(a.code.replace("g-", ""), 10) || 0;
        const numB = parseInt(b.code.replace("g-", ""), 10) || 0;
        return numA - numB;
      });

      localStorage.setItem("edam_master_sites_list", JSON.stringify(masterList));
      return masterList;
    }

    function saveMasterSitesList(list) {
      localStorage.setItem("edam_master_sites_list", JSON.stringify(list));
    }

    let appState = loadState();

    function loadState() {
      const storageKey = `edam_site_data_${CURRENT_SITE_CODE}`;
      const saved = localStorage.getItem(storageKey);
      if (saved) {
        try {
          const parsed = JSON.parse(saved);
          if (CURRENT_SITE_CODE === "g-1" && parsed.version !== DATA_VERSION) {
            localStorage.setItem(storageKey, JSON.stringify(initialData));
            return initialData;
          }
          if (!parsed.customColors) parsed.customColors = initialData.customColors;
          return parsed;
        } catch (e) {}
      }
      
      if (CURRENT_SITE_CODE === "g-1") {
        localStorage.setItem(storageKey, JSON.stringify(initialData));
        return initialData;
      }

      const masterList = getMasterSitesList();
      const masterSiteItem = masterList.find(s => s.code === CURRENT_SITE_CODE);
      const customTitle = masterSiteItem ? masterSiteItem.title : null;

      return createNewSiteTemplate(CURRENT_SITE_CODE, customTitle);
    }

    function createNewSiteTemplate(code, customTitle = null) {
      const idNum = parseInt(code.replace('g-', ''), 10) || 2;
      const template = {
        version: DATA_VERSION,
        isAdmin: false,
        project: {
          subtitle: "신규 고객님의 공사",
          title: customTitle || `신규 현장 ${idNum}`,
          startDate: getTodayString(),
          endDate: getTodayString()
        },
        customColors: [...initialData.customColors],
        managers: [
          { id: "m1", role: "총괄 현장소장", name: "김인디", phone: "010-1234-5678" }
        ],
        schedules: [
          { id: "s1", name: "착공 및 보양", startDate: getTodayString(), endDate: getTodayString(), color: "#8b5cf6" }
        ],
        journals: [
          {
            id: "j1",
            date: getTodayString(),
            tags: ["착공"],
            description: `현장 [${code}] 착공 및 가설 보양작업 진행 완료`,
            photos: ["https://indecompany2.mycafe24.com/images/img_visual_01.jpg"]
          }
        ],
        designs: [],
        documents: []
      };
      localStorage.setItem(`edam_site_data_${code}`, JSON.stringify(template));
      return template;
    }

    // Global Cloud Database Sync Methods
    async function syncFromCloud() {
      try {
        const res = await fetch(`/api/site?code=${CURRENT_SITE_CODE}`);
        if (res.ok) {
          const cloudData = await res.json();
          if (cloudData && cloudData.project) {
            appState = cloudData;
            localStorage.setItem(`edam_site_data_${CURRENT_SITE_CODE}`, JSON.stringify(appState));
            renderApp();
          }
        }
      } catch (e) {}
    }

    async function syncToCloud() {
      try {
        await fetch(`/api/site`, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ code: CURRENT_SITE_CODE, data: appState })
        });
      } catch (e) {}
    }

    function saveState() {
      const storageKey = `edam_site_data_${CURRENT_SITE_CODE}`;
      try {
        localStorage.setItem(storageKey, JSON.stringify(appState));
      } catch (err) {
        console.warn("Storage warning:", err);
      }

      const masterList = getMasterSitesList();
      const siteItem = masterList.find(s => s.code === CURRENT_SITE_CODE);
      if (siteItem) {
        siteItem.title = appState.project.title;
        siteItem.subtitle = appState.project.subtitle;
        saveMasterSitesList(masterList);
      }

      syncToCloud();

      renderApp();
    }

        e.stopPropagation();

      adminToggleBtn.addEventListener("click", () => {
        appState.isAdmin = !appState.isAdmin;

          adminToggleBtn.classList.add("active");
          adminToggleTxt.textContent = "수정모드 ON (종료하기)";
          document.body.classList.add("admin-mode");
        } else {
          adminToggleBtn.classList.remove("active");
          adminToggleTxt.textContent = "수정모드";
          document.body.classList.remove("admin-mode");
        }
        renderApp();
      });

      document.getElementById("prevMonthBtn").addEventListener("click", () => {
        currentMonth--;
        if (currentMonth < 1) {
          currentMonth = 12;
          currentYear--;

        renderCalendar();
      });

      document.getElementById("nextMonthBtn").addEventListener("click", () => {
        currentMonth++;

          currentYear++;

    function editSiteTitle(code) {
      const masterList = getMasterSitesList();
      const site = masterList.find(s => s.code === code);
      if (!site) return;

      const newTitle = prompt(`[${code}] 현장명을 변경하시겠습니까?`, site.title);
      if (!newTitle || !newTitle.trim()) return;

      const trimmedTitle = newTitle.trim();
      site.title = trimmedTitle;

      const targetKey = `edam_site_data_${code}`;
      const targetDataStr = localStorage.getItem(targetKey);
      if (targetDataStr) {
        try {
          const targetData = JSON.parse(targetDataStr);
          targetData.project.title = trimmedTitle;
          localStorage.setItem(targetKey, JSON.stringify(targetData));
        } catch (e) {}
      } else {
        createNewSiteTemplate(code, trimmedTitle);
      }

      saveMasterSitesList(masterList);

      if (code === CURRENT_SITE_CODE) {
        appState.project.title = trimmedTitle;
        saveState();
      } else {
        renderSiteDropdownList();
      }

    function renderCalendar() {
      document.getElementById("currentMonthTxt").textContent = `${currentYear}년 ${currentMonth}월`;
      const grid = document.getElementById("calendarGrid");
      grid.innerHTML = "";

      const days = [
        { name: "월", cls: "" },
        { name: "화", cls: "" },
        { name: "수", cls: "" },
        { name: "목", cls: "" },
        { name: "금", cls: "" },
        { name: "토", cls: "sat" },
        { name: "일", cls: "sun" }
      ];
      days.forEach(d => {
        const div = document.createElement("div");
        div.className = `cal-day-header ${d.cls}`;
        div.textContent = d.name;
        grid.appendChild(div);
      });

      const firstDay = new Date(currentYear, currentMonth - 1, 1);
      const lastDay = new Date(currentYear, currentMonth, 0);
      const prevLastDay = new Date(currentYear, currentMonth - 1, 0);

      let startDayOfWeek = firstDay.getDay() - 1;
      if (startDayOfWeek < 0) startDayOfWeek = 6;

      const totalDays = lastDay.getDate();
      const prevDaysCount = startDayOfWeek;

      const calendarDates = [];

      for (let i = prevDaysCount - 1; i >= 0; i--) {
        const num = prevLastDay.getDate() - i;
        calendarDates.push({ num, isOtherMonth: true, dateStr: null });
      }

      const todayStr = getTodayString();
      for (let day = 1; day <= totalDays; day++) {
        const dateStr = `${currentYear}-${String(currentMonth).padStart(2, '0')}-${String(day).padStart(2, '0')}`;
        const isToday = dateStr === todayStr;
        const dObj = new Date(currentYear, currentMonth - 1, day);
        const dayOfWeek = dObj.getDay();
        const isSun = dayOfWeek === 0;
        const isSat = dayOfWeek === 6;

        let isHolidayRed = false;
        if (currentMonth === 8 && day === 15) isHolidayRed = true; // Aug 15 Red Day

        calendarDates.push({
          num: day,
          isOtherMonth: false,
          isToday,
          dateStr,
          isSun,
          isSat,
          isHolidayRed,
          dayOfWeekIndex: (dayOfWeek + 6) % 7
        });
      }

      const totalCellsSoFar = calendarDates.length;
      const totalCellRows = Math.ceil(totalCellsSoFar / 7) * 7;
      for (let day = 1; day <= (totalCellRows - totalCellsSoFar); day++) {
        calendarDates.push({ num: day, isOtherMonth: true, dateStr: null });
      }

      const activeSchedules = [...appState.schedules].sort((a, b) => {
        if (a.startDate !== b.startDate) return a.startDate.localeCompare(b.startDate);
        return b.endDate.localeCompare(a.endDate);
      });

      const dateTracks = {};
      calendarDates.forEach(d => {
        if (d.dateStr) dateTracks[d.dateStr] = [];
      });

      activeSchedules.forEach(s => {
        let slot = 0;
        while (true) {
          let conflict = false;
          for (const d of calendarDates) {
            if (d.dateStr && d.dateStr >= s.startDate && d.dateStr <= s.endDate) {
              if (dateTracks[d.dateStr][slot]) {
                conflict = true;
                break;
              }
            }
          }
          if (!conflict) break;
          slot++;
        }

        for (const d of calendarDates) {
          if (d.dateStr && d.dateStr >= s.startDate && d.dateStr <= s.endDate) {
            dateTracks[d.dateStr][slot] = s;
          }
        }
      });

      calendarDates.forEach(d => {
        const cell = document.createElement("div");
        cell.className = `cal-cell ${d.isOtherMonth ? 'other-month' : ''} ${d.isToday ? 'today' : ''} ${d.isSun ? 'sun' : ''} ${d.isSat ? 'sat' : ''} ${d.isHolidayRed ? 'red-day' : ''}`;

        const dateHeader = document.createElement("div");
        dateHeader.className = "cal-date-num";
        dateHeader.innerHTML = `
          <span style="${(d.isSun || d.isHolidayRed) ? 'color:#e53e3e; font-weight:800;' : ''}">${d.num}</span>
        `;
        cell.appendChild(dateHeader);

        if (d.dateStr) {
          const barContainer = document.createElement("div");
          barContainer.className = "gantt-bar-container";

          const daySlotSchedules = dateTracks[d.dateStr] || [];
          const maxSlots = daySlotSchedules.length;

          for (let slot = 0; slot < maxSlots; slot++) {
            const s = daySlotSchedules[slot];
            if (!s) {
              const empty = document.createElement("div");
              empty.className = "gantt-item-placeholder";
              barContainer.appendChild(empty);
              continue;
            }

            const dayIndexInWeek = d.dayOfWeekIndex;
            const isEventStart = (d.dateStr === s.startDate) || (dayIndexInWeek === 0);
            const isEventEnd = (d.dateStr === s.endDate) || (dayIndexInWeek === 6);

            const bar = document.createElement("div");
            bar.className = `gantt-item ${isEventStart ? 'is-start' : ''} ${isEventEnd ? 'is-end' : ''}`;
            bar.style.backgroundColor = s.color || "#475569";

            if (isEventStart || d.dateStr === s.startDate) {
              const labelSpan = document.createElement("span");
              labelSpan.className = "bar-txt-label";
              labelSpan.textContent = s.name;
              bar.appendChild(labelSpan);
            }

            bar.title = `${s.name} (${s.startDate} ~ ${s.endDate})`;

            barContainer.appendChild(bar);
          }

          cell.appendChild(barContainer);

          // Day Cell Touch / Click Handler -> Opens Day Details Popup!
          cell.onclick = (e) => {
            openDayDetailsModal(d.dateStr, d.num, daySlotSchedules);
          };
        }

        grid.appendChild(cell);
      });
    }

            <input type="text" class="form-input" id="newColorName" placeholder="예: 목공 (우드)" style="flex:1;" />
          </div>
          <button type="button" class="btn-secondary" style="width:100%; padding:6px 0; font-size:0.8rem;" onclick="addNewCustomColor()">+ 색상 팔레트에 추가하기</button>
        </div>
      `;

      openModal("새 공사 일정 추가", html, () => {
        const name = document.getElementById("inputSchedName").value.trim();
        const startDate = document.getElementById("inputSchedStart").value;
        const endDate = document.getElementById("inputSchedEnd").value;
        const color = document.getElementById("inputSchedColor").value;

        if (!name || !startDate || !endDate) {
          alert("공정명과 날짜를 입력해주세요.");
          return false;
        }

        appState.schedules.push({
          id: "s_" + Date.now(),
          name,
          startDate,
          endDate,
          color
        });

        saveState();
        return true;
      });
    }

    function addNewCustomColor() {
      const hex = document.getElementById("newColorHex").value;
      const name = document.getElementById("newColorName").value.trim();

      if (!name) {
        alert("색상 명칭을 입력해주세요.");
        return;
      }

      appState.customColors.push({ name, hex });
      saveState();

      const select = document.getElementById("inputSchedColor");
      if (select) {
        select.innerHTML = renderColorOptionsHtml(hex);
      }
      alert(`'${name}' 색상이 추가되었습니다!`);
    }

    function openEditScheduleModal(s) {
      const html = `
        <div class="form-group">
          <label class="form-label">공정명</label>
          <input type="text" class="form-input" id="inputSchedName" value="${escapeHtml(s.name)}" />
        </div>
        <div class="form-group">
          <label class="form-label">시작일</label>
          <input type="date" class="form-input" id="inputSchedStart" value="${s.startDate}" />
        </div>
        <div class="form-group">
          <label class="form-label">마감일</label>
          <input type="date" class="form-input" id="inputSchedEnd" value="${s.endDate}" />
        </div>
        <div class="form-group">
          <label class="form-label">간트차트 색상</label>
          <select class="form-select" id="inputSchedColor">
            ${renderColorOptionsHtml(s.color)}
          </select>
        </div>
        <div style="margin-top:14px;">
          <button class="btn-secondary" style="color:#e53e3e; width:100%; border:1px solid #feb2b2;" onclick="deleteSchedule('${s.id}')">이 일정 삭제</button>
        </div>
      `;
      openModal("공사 일정 수정", html, () => {
        s.name = document.getElementById("inputSchedName").value.trim();
        s.startDate = document.getElementById("inputSchedStart").value;
        s.endDate = document.getElementById("inputSchedEnd").value;
        s.color = document.getElementById("inputSchedColor").value;
        saveState();
        return true;
      });
    }

    function deleteSchedule(id) {
      if (confirm("이 일정을 삭제하시겠습니까?")) {
        appState.schedules = appState.schedules.filter(s => s.id !== id);
        closeModal();
        saveState();
      }
    }

    let tempUploadedJournalPhotos = [];

    function openAddJournalModal() {
      tempUploadedJournalPhotos = [];

      const html = `
        <div class="form-group">
          <label class="form-label">일보 날짜</label>
          <input type="date" class="form-input" id="inputJDate" value="${getTodayString()}" />
        </div>
        <div class="form-group">
          <label class="form-label">공정 태그 (쉼표로 구분)</label>
          <input type="text" class="form-input" id="inputJTags" placeholder="오늘 공정, 필름" />
        </div>
        <div class="form-group">
          <label class="form-label">금일 공사내용 수기입력</label>
          <textarea class="form-textarea" id="inputJDesc" rows="4" placeholder="커피마시고 그대로 버리고오기"></textarea>
        </div>
        <div class="form-group">
          <label class="form-label">📷 현장 사진 업로드 (PC / 모바일 파일 선택)</label>
          <div class="file-upload-box" onclick="document.getElementById('inputJPhotoFiles').click()">
            <div class="file-upload-icon">📸</div>
            <div class="file-upload-txt">클릭하여 사진 파일 여러 개 선택 (또는 드래그)</div>
            <input type="file" id="inputJPhotoFiles" multiple accept="image/*" style="display:none;" onchange="handleJournalPhotoUpload(event)" />
          </div>
          <div id="journalUploadPreview" class="photo-grid" style="margin-top:10px;"></div>
        </div>
      `;

      openModal("새 공사일보 작성", html, () => {
        const date = document.getElementById("inputJDate").value;
        const tagsRaw = document.getElementById("inputJTags").value;
        const description = document.getElementById("inputJDesc").value.trim();

        if (!date || !description) {
          alert("날짜와 공사내용을 입력해주세요.");
          return false;
        }

        const tags = tagsRaw.split(",").map(t => t.trim()).filter(t => t.length > 0);
        const photos = tempUploadedJournalPhotos.length > 0 ? tempUploadedJournalPhotos : [
          "https://indecompany2.mycafe24.com/images/img_visual_01.jpg",
          "https://indecompany2.mycafe24.com/images/img_visual_02.jpg"
        ];

        appState.journals.unshift({
          id: "j_" + Date.now(),
          date,
          tags: tags.length > 0 ? tags : ["오늘 공정"],
          description,
          photos
        });

        saveState();
        return true;
      });
    }

    function handleJournalPhotoUpload(event) {
      const files = Array.from(event.target.files);
      const previewContainer = document.getElementById("journalUploadPreview");

      files.forEach(file => {
        const reader = new FileReader();
        reader.onload = (e) => {
          const dataUrl = e.target.result;
          tempUploadedJournalPhotos.push(dataUrl);

          const thumb = document.createElement("div");
          thumb.className = "photo-thumb";
          thumb.innerHTML = `<img src="${dataUrl}" alt="업로드 이미지" />`;
          previewContainer.appendChild(thumb);
        };
        reader.readAsDataURL(file);
      });
    }

    function deleteJournalPhoto(journalId, photoIdx) {
      if (confirm("이 사진을 삭제하시겠습니까?")) {
        const j = appState.journals.find(item => item.id === journalId);
        if (j) {
          j.photos.splice(photoIdx, 1);
          saveState();
        }
      }
    }

    function openJournalHistoryModal() {
      let html = `<div style="display:flex; flex-direction:column; gap:16px;">`;
      appState.journals.forEach(j => {
        html += `
          <div style="border-bottom:1px solid #e2e8f0; padding-bottom:12px;">
            <div style="font-weight:800; color:var(--primary-dark);">${j.date}</div>
            <div style="font-size:0.85rem; color:#4a5568; margin:6px 0; white-space:pre-line;">${escapeHtml(j.description)}</div>
            <div class="photo-grid" style="margin-top:8px;">
              ${j.photos.map(p => `<img src="${p}" style="width:100%; aspect-ratio:1; object-fit:cover; border-radius:8px;" onclick="openLightbox('${p}', '${j.date} 일보')" />`).join('')}
            </div>
          </div>
        `;
      });
      html += `</div>`;
      openModal(`지난 일보 목록 (${appState.journals.length}건)`, html, () => true);
    }

    let selectedDocFile = null;

    function openAddDocModal() {
      selectedDocFile = null;

      const html = `
        <div class="form-group">
          <label class="form-label">자료 유형 선택</label>
          <select class="form-select" id="inputDocCategory">
            <option value="design">🖼️ 최종 시안 / 평면도 / 3D 렌더링 (이미지)</option>
            <option value="file">📄 계약서 / 견적서 / 하자보증서 (문서/PDF)</option>
          </select>
        </div>
        <div class="form-group">
          <label class="form-label">자료/파일 명칭</label>
          <input type="text" class="form-input" id="inputDocName" placeholder="예: 회사 별장공사 전기도면.pdf" />
        </div>
        <div class="form-group">
          <label class="form-label">📁 파일 업로드 (PC / 모바일 선택)</label>
          <div class="file-upload-box" onclick="document.getElementById('inputDocFile').click()">
            <div class="file-upload-icon">📄</div>
            <div class="file-upload-txt" id="docUploadStatusTxt">클릭하여 파일 선택 (이미지, PDF, 문서 등)</div>
            <input type="file" id="inputDocFile" accept="image/*,.pdf,.doc,.docx,.xls,.xlsx,.hwp" style="display:none;" onchange="handleDocFileUpload(event)" />
          </div>
        </div>
      `;

      openModal("현장 자료 직접 업로드", html, () => {
        const cat = document.getElementById("inputDocCategory").value;
        let name = document.getElementById("inputDocName").value.trim();

        if (!selectedDocFile) {
          alert("업로드할 파일을 선택해주세요.");
          return false;
        }

        if (!name) name = selectedDocFile.name;

        const reader = new FileReader();
        reader.onload = (e) => {
          const fileDataUrl = e.target.result;
          if (cat === "design") {
            appState.designs.push({
              id: "d_" + Date.now(),
              title: name,
              url: fileDataUrl
            });
          } else {
            appState.documents.push({
              id: "doc_" + Date.now(),
              name,
              type: name.toLowerCase().endsWith(".pdf") ? "pdf" : "image",
              url: fileDataUrl
            });
          }
          saveState();
        };
        reader.readAsDataURL(selectedDocFile);

        return true;
      });
    }

    function handleDocFileUpload(event) {
      const file = event.target.files[0];
      if (file) {
        selectedDocFile = file;
        document.getElementById("docUploadStatusTxt").textContent = `✅ 선택됨: ${file.name} (${Math.round(file.size / 1024)} KB)`;
        const nameInput = document.getElementById("inputDocName");
        if (nameInput && !nameInput.value) {
          nameInput.value = file.name;
        }
      }
    }

    function deleteDesignPhoto(id) {
      if (confirm("이 시안/도면 이미지를 삭제하시겠습니까?")) {
        appState.designs = appState.designs.filter(d => d.id !== id);
        saveState();
      }
    }

    function deleteDocument(id) {
      if (confirm("이 서류/문서를 삭제하시겠습니까?")) {
        appState.documents = appState.documents.filter(doc => doc.id !== id);
        saveState();
      }
    }

    function getTodayString() {
      const today = new Date();
      const yyyy = today.getFullYear();
      const mm = String(today.getMonth() + 1).padStart(2, '0');
      const dd = String(today.getDate()).padStart(2, '0');
      return `${yyyy}-${mm}-${dd}`;
    }

    function escapeHtml(str) {
      if (!str) return '';
      return str.replace(/[&<>"']/g, function(m) {
        return {
          '&': '&amp;',
          '<': '&lt;',
          '>': '&gt;',
          '"': '&quot;',
          "'": '&#039;'
        }[m];
      });
    }
  </script>
</body>
</html>
