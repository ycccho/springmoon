<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="noindex, nofollow, noarchive, nosnippet">
  <title>BB Backlink Explorer</title>
  
  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  
  <!-- Font -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700&family=Geist+Mono:wght@400;600&display=swap" rel="stylesheet">
  
  <!-- Phosphor Icons -->
  <script src="https://unpkg.com/@phosphor-icons/web"></script>

  <style>
    body {
      font-family: 'Geist', -apple-system, BlinkMacSystemFont, sans-serif;
      background-color: #fafafa;
      color: #18181b;
    }
    .font-mono {
      font-family: 'Geist Mono', monospace;
    }
    input:focus {
      outline: none;
    }
  </style>
</head>
<body class="min-h-screen flex flex-col justify-between p-4 sm:p-8 md:p-12 selection:bg-neutral-900 selection:text-white">

  <!-- Header -->
  <header class="max-w-5xl w-full mx-auto flex items-center justify-between py-2 border-b border-neutral-200">
    <div class="flex items-center gap-2.5">
      <span class="w-2.5 h-2.5 rounded-full bg-neutral-900"></span>
      <span class="font-bold text-sm tracking-tight text-neutral-900">BB Backlink Explorer</span>
    </div>
    <div class="text-xs text-neutral-400 font-mono">
      Common Crawl & Open Web Graph
    </div>
  </header>

  <!-- Main Content -->
  <main class="max-w-5xl w-full mx-auto my-auto py-12 space-y-8 flex-1">
    
    <!-- Search Box -->
    <div class="space-y-4">
      <div class="space-y-1">
        <h1 class="text-2xl sm:text-3xl font-bold tracking-tight text-neutral-900">외부 백링크 검색</h1>
        <p class="text-xs sm:text-sm text-neutral-500">
          분석할 웹사이트 URL 또는 도메인을 입력하면 연결된 외부 백링크 목록을 추출합니다.
        </p>
      </div>

      <form id="searchForm" class="flex gap-2 pt-2">
        <div class="relative flex-1">
          <input
            type="text"
            id="domainInput"
            placeholder="도메인 또는 URL 입력 (예: busaninterior.kr, naver.com, inde.co.kr)"
            class="w-full bg-white border border-neutral-300 rounded-lg px-4 py-3 text-sm text-neutral-900 placeholder:text-neutral-400 focus:border-neutral-900 focus:ring-1 focus:ring-neutral-900 font-mono shadow-sm transition-all"
            required
            autofocus
          >
        </div>
        <button
          type="submit"
          id="searchBtn"
          class="px-6 py-3 bg-neutral-900 hover:bg-neutral-800 active:scale-[0.98] text-white font-medium text-sm rounded-lg shadow-sm transition-all flex items-center gap-2 flex-shrink-0 cursor-pointer disabled:opacity-50"
        >
          <span id="btnText">조회</span>
        </button>
      </form>
    </div>

    <!-- Results Container (Hidden until search) -->
    <div id="resultsWrapper" class="hidden space-y-4 pt-4 border-t border-neutral-200">
      
      <!-- Meta Header & Action -->
      <div class="flex flex-wrap items-center justify-between gap-3 text-xs">
        <div class="flex items-center gap-3 font-mono text-neutral-600">
          <span>도메인: <strong id="targetDomainText" class="text-neutral-900 font-semibold">-</strong></span>
          <span class="text-neutral-300">|</span>
          <span>발견된 백링크: <strong id="countText" class="text-neutral-900 font-semibold">0</strong>개</span>
          <span class="text-neutral-300">|</span>
          <span>참조 도메인: <strong id="refCountText" class="text-neutral-900 font-semibold">0</strong>개</span>
        </div>

        <div class="flex items-center gap-2">
          <button
            onclick="downloadCSV()"
            class="px-3 py-1.5 rounded-md border border-neutral-300 bg-white hover:bg-neutral-50 text-neutral-700 font-medium text-xs flex items-center gap-1.5 shadow-sm transition-colors cursor-pointer"
          >
            <i class="ph ph-download-simple"></i>
            <span>CSV 저장</span>
          </button>
        </div>
      </div>

      <!-- Table Card -->
      <div class="bg-white border border-neutral-200 rounded-xl shadow-sm overflow-hidden">
        <div class="overflow-x-auto">
          <table class="w-full text-left text-xs text-neutral-700 border-collapse">
            <thead class="bg-neutral-50 text-neutral-500 font-semibold border-b border-neutral-200 text-[11px] uppercase tracking-wider">
              <tr>
                <th class="py-3 px-4 w-12 text-center">#</th>
                <th class="py-3 px-4 w-44">출처 도메인</th>
                <th class="py-3 px-4">백링크 걸린 페이지 URL</th>
                <th class="py-3 px-4">앵커 텍스트</th>
                <th class="py-3 px-4 w-24">링크 속성</th>
                <th class="py-3 px-4 w-32">수집 소스</th>
                <th class="py-3 px-4 w-16 text-center">열기</th>
              </tr>
            </thead>
            <tbody id="tableBody" class="divide-y divide-neutral-100 font-normal">
              <!-- Rendered rows -->
            </tbody>
          </table>
        </div>
      </div>
    </div>

  </main>

  <!-- Footer -->
  <footer class="max-w-5xl w-full mx-auto py-4 border-t border-neutral-200 text-center text-xs text-neutral-400 font-mono">
    BB Backlink Explorer • Common Crawl & Open Web Graph Intelligence
  </footer>

  <script>
    let backlinkList = [];

    document.getElementById('searchForm').addEventListener('submit', function(e) {
      e.preventDefault();
      const query = document.getElementById('domainInput').value.trim();
      if (query) executeSearch(query);
    });

    async function executeSearch(inputDomain) {
      const searchBtn = document.getElementById('searchBtn');
      const btnText = document.getElementById('btnText');
      const resultsWrapper = document.getElementById('resultsWrapper');
      const tbody = document.getElementById('tableBody');
      const cleanDomain = inputDomain.replace(/^(https?:\\/\\/)?(www\\.)?/, '').split('/')[0].toLowerCase();

      searchBtn.disabled = true;
      btnText.textContent = '조회 중...';
      resultsWrapper.classList.remove('hidden');

      document.getElementById('targetDomainText').textContent = cleanDomain;
      document.getElementById('countText').textContent = '...';
      document.getElementById('refCountText').textContent = '...';

      tbody.innerHTML = `
        <tr>
          <td colspan="7" class="py-12 text-center text-neutral-400 text-xs font-mono">
            Common Crawl 및 웹 그래프에서 ${cleanDomain} 관련 백링크를 실시간 검색 중입니다...
          </td>
        </tr>
      `;

      try {
        const res = await fetch(\`/api/bb_backlink?domain=\${encodeURIComponent(cleanDomain)}\`);
        if (!res.ok) throw new Error(\`서버 응답 오류 (HTTP \${res.status})\`);
        const data = await res.json();
        if (!data.success) throw new Error(data.error || '백링크 조회에 실패했습니다.');

        backlinkList = data.backlinks || [];

        document.getElementById('countText').textContent = backlinkList.length;
        document.getElementById('refCountText').textContent = data.summary?.referringDomainsCount || 0;

        renderTable();

      } catch (err) {
        tbody.innerHTML = `
          <tr>
            <td colspan="7" class="py-10 text-center text-red-500 text-xs font-mono">
              오류: \${err.message}
            </td>
          </tr>
        `;
      } finally {
        searchBtn.disabled = false;
        btnText.textContent = '조회';
      }
    }

    function renderTable() {
      const tbody = document.getElementById('tableBody');

      if (!backlinkList || backlinkList.length === 0) {
        tbody.innerHTML = `
          <tr>
            <td colspan="7" class="py-12 text-center text-neutral-400 text-xs font-mono">
              발견된 백링크 레코드가 없습니다.
            </td>
          </tr>
        `;
        return;
      }

      tbody.innerHTML = backlinkList.map((item, idx) => {
        return `
          <tr class="hover:bg-neutral-50/80 transition-colors text-xs">
            <td class="py-3 px-4 font-mono text-neutral-400 text-center text-[11px]">\${idx + 1}</td>
            <td class="py-3 px-4 font-mono font-medium text-neutral-900 whitespace-nowrap">
              \${item.sourceDomain}
            </td>
            <td class="py-3 px-4 max-w-[280px]">
              <span class="truncate block font-mono text-neutral-600 select-all" title="\${item.sourceUrl}">
                \${item.sourceUrl}
              </span>
            </td>
            <td class="py-3 px-4 max-w-[220px]">
              <span class="truncate block text-neutral-800" title="\${item.anchorText}">
                \${item.anchorText || '-'}
              </span>
            </td>
            <td class="py-3 px-4 whitespace-nowrap">
              <span class="px-2 py-0.5 rounded text-[11px] font-mono font-medium \${item.rel === 'dofollow' ? 'bg-emerald-50 text-emerald-700 border border-emerald-200' : 'bg-neutral-100 text-neutral-600'}">
                \${item.rel || 'dofollow'}
              </span>
            </td>
            <td class="py-3 px-4 font-mono text-[11px] text-neutral-500 whitespace-nowrap">
              \${item.engine}
            </td>
            <td class="py-3 px-4 text-center whitespace-nowrap">
              <a href="\${item.sourceUrl}" target="_blank" rel="noopener noreferrer" class="inline-flex p-1.5 rounded hover:bg-neutral-200 text-neutral-600 hover:text-neutral-900 transition-colors">
                <i class="ph ph-arrow-square-out text-sm"></i>
              </a>
            </td>
          </tr>
        `;
      }).join('');
    }

    function downloadCSV() {
      if (!backlinkList || backlinkList.length === 0) {
        alert('저장할 백링크 데이터가 없습니다.');
        return;
      }

      let csv = 'data:text/csv;charset=utf-8,\uFEFF';
      csv += '번호,출처도메인,백링크페이지URL,앵커텍스트,링크유형,수집소스,타겟URL\n';

      backlinkList.forEach((b, i) => {
        csv += [
          i + 1,
          `"\${b.sourceDomain}"`,
          `"\${b.sourceUrl}"`,
          `"\${(b.anchorText || '').replace(/"/g, '""')}"`,
          `"\${b.rel || 'dofollow'}"`,
          `"\${b.engine}"`,
          `"\${b.targetUrl}"`
        ].join(',') + '\n';
      });

      const uri = encodeURI(csv);
      const link = document.createElement('a');
      link.setAttribute('href', uri);
      link.setAttribute('download', `backlinks_\${document.getElementById('targetDomainText').textContent}_\${new Date().toISOString().slice(0,10)}.csv`);
      document.body.appendChild(link);
      link.click();
      document.body.removeChild(link);
    }
  </script>
</body>
</html>
